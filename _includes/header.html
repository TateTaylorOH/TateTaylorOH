<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  {% seo %}
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ 'assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />
  <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
  <meta name="google-site-verification" content="jSueJx3jsZPBZAXLoa0FslQH0cTCV6zv7iYh72gH0aA" />
  <link rel="icon" href="https://tatetayloroh.com/assets/img/icon.png"  type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Set current year
      document.getElementById("currentYear").textContent = new Date().getFullYear();
    
      // Show modal based on URL parameter
      const params = new URLSearchParams(window.location.search);
      const source = params.get("from");
      const modals = {
        404: "popup404",
      };
    
      if (modals[source]) {
        const modalElement = document.getElementById(modals[source]);
        if (modalElement) {
          new bootstrap.Modal(modalElement).show();
          history.replaceState({}, "", window.location.pathname);
        }
      }
    });
  </script>
</head>
