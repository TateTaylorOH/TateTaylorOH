---
layout: default
---
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
	{% for post in paginator.posts %}
		{% include cards.html %}
	{% endfor %}
</div>
<div class="d-flex justify-content-between mt-3">
	<div>
		{% if paginator.previous_page %}
			<a class="button-link" href="{{ paginator.previous_page_path | relative_url }}">← Newer Posts</a>
		{% endif %}
	</div>
	<div>
		{% if paginator.next_page %}
			<a class="button-link" href="{{ paginator.next_page_path | relative_url }}">Older Posts →</a>
		{% endif %}
	</div>
</div>
