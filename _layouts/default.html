<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}" data-bs-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		{% seo %}
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
		<link rel="stylesheet" href="{{ 'assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />
		<script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
		<meta name="google-site-verification" content="jSueJx3jsZPBZAXLoa0FslQH0cTCV6zv7iYh72gH0aA" />
		<link rel="icon" href="https://tatetayloroh.com/assets/img/icon.png"  type="image/x-icon" />
	</head>
	<body>  
		<div class="container-fluid text-light">
		    <div class="row">
				{% include popups.html %}
				{% include navigation.html %}
		        <main class="col col-12 col-md-9 col-xl-10 p-0 ms-md-auto">
		            <div class="container py-4 pb-5">
						<header class="d-none d-md-block mb-4">
							<img class="img-fluid rounded mb-2" alt="Tate Taylor" src="https://tatetayloroh.com/assets/img/banner.png"/>
						</header>
						<article id="article-content">
							<div id="{{ page.content | default: 'content' }}" class="image-{{ page.image_align | default: 'left' }}">
								{% unless page.hide_title %}
								<h1>{{ page.title }}</h1>
								<hr>
								{% endunless %}						
								{% if page.post %}
								<img class="img-fluid mb-3" src="{{ page.image }}" alt="{{ page.title }}">
								{% endif %}								
								{{ content }}
								{% if page.author %}
								<hr>
								<div class="post-meta text-secondary">{{ page.date | date_to_string }} • {{ page.author }}</div>
								{% endif %}
							</div>
						</article>
					</div>
		        </main>
		    </div>
		</div>
		{% include scripts.html %}
	</body>
</html>
