title: Tate Taylor
tagline: Corgi Enjoyer
description: I am Tate Taylor, a Skyrim mod author and Wabbajack modlist curator.
url: https://tatetayloroh.com

defaults:
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: default
      image: "https://tatetayloroh.com/assets/img/banner.png"
  - scope:
      path: "blog/_posts"
    values:
      layout: post
  - scope:
      path: "rickardcalvert/ecss/_posts"
    values:
      layout: post

plugins:
  - jekyll-paginate

paginate: 9 # Number of posts per page
paginate_path: "/page:num" # Path for pagination
