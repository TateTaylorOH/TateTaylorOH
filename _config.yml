title: Tate Taylor
tagline: Corgi Enjoyer
description: I am Tate Taylor, a Skyrim mod author and Wabbajack modlist curator.
url: https://tatetayloroh.com
excerpt_separator: "<!--more-->"

defaults:
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: default
      image: "https://tatetayloroh.com/assets/img/thumbnail.png"
  - scope:
      path: "blog/_posts"
    values:
      post: true
      permalink: "/post/page.title"
  - scope:
      path: "rickardcalvert/ecss/_posts"
    values:
      post: true
      permalink: "/rickardcalvert/ecss/page.title"

plugins:
  - jekyll-paginate

paginate: 9 # Number of posts per page
paginate_path: "/page:num" # Path for pagination
