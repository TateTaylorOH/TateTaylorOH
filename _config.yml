title: Tate Taylor
tagline: Corgi Enjoyer
description: I am Tate Taylor, a Skyrim mod author and Wabbajack modlist curator.
url: https://tatetayloroh.com
excerpt_separator: "<!-- excerpt-end -->"

collections:
  rickardcalvert:
    output: true

defaults:
  - scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: page
      image: "https://tatetayloroh.com/assets/img/thumbnail.png"
  - scope:
      path: "blog/_posts"
    values:
      layout: post
      image_align: center
      permalink: "/posts/:title"
  - scope:
      type: "rickardcalvert"
    values:
        layout: post
        image_align: center
  - scope:
      path: "_rickardcalvert/ecss"
    values:
        series: ecss
        
plugins:
  - jekyll-paginate
  - jekyll-redirect-from

paginate: 9 # Number of posts per page
paginate_path: "/page:num" # Path for pagination
